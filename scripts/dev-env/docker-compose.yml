# Real local dev stack. Redis + Postgres here mirror exactly what was proven
# live in this build (real redis-server, real postgresql). Kafka, Schema
# Registry, and Neo4j are included for when you run this outside a
# network-restricted sandbox -- swap KafkaTransport in for InMemoryTransport
# and RegistrySchemaProvider in for LocalSchemaProvider once these are up,
# no other code changes needed.
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: sentinel
    ports: ["5432:5432"]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    ports: ["9092:9092"]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    depends_on: [kafka]
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
    ports: ["8081:8081"]

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/localdev
    ports: ["7474:7474", "7687:7687"]
