# ============================================================
# SENTINEL Secrets Policy
# ============================================================

secrets_backend: "vault"   # HashiCorp Vault or cloud KMS equivalent

policy:
  rotation:
    database_credentials_days: 30
    api_keys_days: 90
    tls_certificates_hours: 24
    kafka_sasl_credentials_days: 30

  storage:
    never_in_code: true
    never_in_config_files: true
    never_in_logs: true
    never_in_kafka_payloads: true
    injection_method: "sidecar_env_injection"  # vault-agent sidecar, not baked into images

  access:
    audit_all_reads: true
    require_justification_for_production_secrets: true
    break_glass_procedure: "documented in runbooks/break-glass.md, requires 2-person approval"

  llm_provider_keys:
    storage: vault
    scope: "safety_copilot_agent only"
    rate_limit_alert_threshold_pct: 80

  encryption_at_rest:
    postgres: "AES-256, transparent data encryption"
    redis: "AES-256, encrypted persistence"
    kafka: "encryption enabled on disk volumes"
    vector_db: "AES-256"

  pii_handling:
    worker_biometric_data:
      retention_days: 90
      encryption: "field-level AES-256, separate key from general data"
      access_requires: ["safety_officer", "admin"]
    audit_logs:
      retention_years: 7
      pii_redaction_after_days: 365   # worker_id pseudonymized after 1 year, full record retained for compliance
